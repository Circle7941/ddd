<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>구경 — SseulSaEop</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root{
    --purple:#eee5ff;
    --deep:#24143d;
    --violet:#6741b5;
    --forest:#173d2c;
    --olive:#65702b;
    --muted:#756d7f;
    --line:#d9d0e7;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:var(--purple);
    color:var(--deep);
    font-family:"IBM Plex Sans KR",sans-serif;
}

.header{
    height:72px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 5vw;
    border-bottom:1px solid #ffffff99;
}

.logo{
    font:700 21px "Space Grotesk";
}

.nav{
    display:flex;
    gap:28px;
    font:700 13px "Space Grotesk","IBM Plex Sans KR";
}

a{
    color:inherit;
    text-decoration:none;
}

.explore{
    height:calc(100vh - 72px);
    position:relative;
}

.layout{
    width:min(1000px,90%);
    height:100%;
    margin:auto;
    display:grid;
    grid-template-rows:42% 58%;
}

.score-panel{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.score-line{
    position:absolute;
    width:75%;
    height:3px;
    background:linear-gradient(
        to right,
        var(--forest),
        #77737e,
        var(--olive)
    );
}

.slider{
    position:absolute;
    width:75%;
    height:35px;
    opacity:0;
    cursor:pointer;
    z-index:5;
}

.knob{
    position:absolute;
    width:24px;
    height:24px;
    border:5px solid var(--violet);
    background:white;
    border-radius:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:4;
}

.value{
    position:absolute;
    top:calc(50% + 25px);
    transform:translateX(-50%);
    font:700 12px "Space Grotesk";
}

.label{
    position:absolute;
    top:calc(50% - 38px);
    font:700 10px "Space Grotesk";
}

.label.useless{
    left:12%;
    color:var(--forest);
}

.label.useful{
    right:12%;
    color:var(--olive);
}

.fact-area{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding-top:20px;
    touch-action:pan-y;
}

.fact-card{
    width:min(760px,90%);
    padding:30px 40px;
    border:1px solid var(--line);
    background:#ffffffc9;
    text-align:center;
}

.date{
    color:var(--muted);
    font:500 10px "Space Grotesk";
    margin-bottom:20px;
}

.fact{
    margin:0;
    font:700 clamp(25px,4vw,45px)/1.35 "Space Grotesk","IBM Plex Sans KR";
    letter-spacing:-1.5px;
}

.nickname{
    margin-top:22px;
    color:var(--muted);
    font-size:11px;
}

.down{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:48px;
    height:48px;
    border:1px solid var(--forest);
    background:var(--forest);
    color:white;
    font-size:20px;
    z-index:20;
}

.down:hover{
    background:var(--olive);
}

.empty{
    display:grid;
    place-items:center;
    height:100%;
    text-align:center;
}

@media(max-width:800px){

    .header{
        height:64px;
        padding:0 5%;
    }

    .nav{
        gap:14px;
        font-size:11px;
    }

    .explore{
        height:calc(100dvh - 64px);
    }

    .layout{
        width:100%;
        height:100%;
        display:grid;
        grid-template-columns:minmax(0,1fr) 82px;
        grid-template-rows:1fr;
    }

    .fact-area{
        width:100%;
        height:100%;
        min-height:0;
        padding:15px 8px 15px 15px;
        align-items:center;
        overflow:hidden;
    }

    .fact-card{
        width:100%;
        height:calc(100dvh - 115px);
        min-height:0;
        padding:50px 18px 35px;
        display:flex;
        flex-direction:column;
        align-items:flex-start;
        justify-content:center;
        text-align:left;
        overflow:hidden;
    }

    .date{
        position:absolute;
        margin:0;
        top:18px;
        left:18px;
    }

    .fact{
        width:100%;
        font-size:clamp(22px,7vw,36px);
        line-height:1.4;
        word-break:keep-all;
    }

    .nickname{
        margin-top:22px;
    }

    .score-panel{
        width:82px;
        height:100%;
        overflow:visible;
    }

    .score-line{
        left:50%;
        top:50%;
        width:3px;
        height:72%;
        transform:translate(-50%,-50%);
        background:linear-gradient(
            to bottom,
            var(--forest),
            #77737e 50%,
            var(--olive)
        );
    }

    .slider{
        left:50%;
        top:50%;
        width:72%;
        height:100%;
        transform:
            translate(-50%,-50%)
            rotate(-90deg);
    }

    .knob{
        left:50%;
        top:50%;
    }

    .value{
        left:50%;
        top:calc(50% + 28px);
        transform:translateX(-50%);
    }

    .label{
        left:50% !important;
        right:auto !important;
        transform:translateX(-50%);
        width:70px;
        text-align:center;
    }

    .label.useless{
        top:10%;
    }

    .label.useful{
        top:auto;
        bottom:10%;
    }

    .down{
        bottom:12px;
        width:43px;
        height:43px;
    }
}
</style>
</head>

<body>

<header class="header">

<a class="logo" href="index.html">
    SseulSaEop
</a>

<nav class="nav">
    <a href="index.html">홈</a>
    <a href="share.html">공유</a>
    <a href="explore.html">구경</a>
</nav>

</header>


<main class="explore">

<div id="loading" class="empty">
    불러오는 중...
</div>


<div
    id="content"
    class="layout"
    style="display:none"
>

    <section class="score-panel">

        <span class="label useless">
            −10 USELESS
        </span>

        <span class="label useful">
            +10 USEFUL
        </span>

        <div class="score-line"></div>

        <input
            id="slider"
            class="slider"
            type="range"
            min="-10"
            max="10"
            step="0.01"
            value="0"
        >

        <div id="knob" class="knob"></div>

        <div id="value" class="value">
            0.00
        </div>

    </section>


    <section
        id="factArea"
        class="fact-area"
    >

        <article class="fact-card">

            <div id="date" class="date"></div>

            <p id="fact" class="fact"></p>

            <div id="nickname" class="nickname"></div>

        </article>

    </section>

</div>


<button
    id="down"
    class="down"
    aria-label="다음 사실"
>
    ↓
</button>

</main>


<script>

const db =
supabase.createClient(
    "https://awujryapgmbhjvagonea.supabase.co",
    "sb_publishable_kTh-cDGS1NZxuTnBMe0qtQ_M6Wn65DE"
);


let facts = [];
let current = 0;

let startY = 0;
let dragging = false;

const slider =
    document.getElementById("slider");

const knob =
    document.getElementById("knob");

const value =
    document.getElementById("value");

const factArea =
    document.getElementById("factArea");


function escapeHTML(str){

    return String(str ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function updateSlider(){

    const score =
        Number(slider.value);

    value.textContent =
        score >= 0
        ? "+" + score.toFixed(2)
        : score.toFixed(2);


    const percent =
        (score + 10) / 20;


    if(window.innerWidth <= 800){

        knob.style.top =
            `${100 - percent * 100}%`;

        knob.style.left = "50%";

    }else{

        knob.style.left =
            `${percent * 100}%`;

        knob.style.top = "50%";

    }

}


slider.addEventListener(
    "input",
    updateSlider
);


async function loadFacts(){

    const {data,error} =
        await db
        .from("facts")
        .select(
            "id,nickname,fact,created_at"
        )
        .order(
            "created_at",
            {ascending:false}
        );


    if(error){

        console.error(error);

        document.getElementById("loading")
        .textContent =
            "사실을 불러오지 못했습니다.";

        return;

    }


    facts = data || [];


    if(!facts.length){

        document.getElementById("loading")
        .innerHTML =
            `
            <div>
                <strong>아직 등록된 사실이 없습니다.</strong>
                <br><br>
                <a href="share.html">
                    첫 번째 사실 남기기 →
                </a>
            </div>
            `;

        document.getElementById("down")
        .style.display="none";

        return;

    }


    document.getElementById("loading")
    .style.display="none";

    document.getElementById("content")
    .style.display="grid";


    showFact();

}


function showFact(){

    const item =
        facts[current];

    document.getElementById("fact")
    .textContent =
        item.fact;

    document.getElementById("nickname")
    .textContent =
        "by " +
        (item.nickname || "익명");


    const date =
        new Date(item.created_at);

    document.getElementById("date")
    .textContent =
        date.toLocaleDateString(
            "ko-KR",
            {
                year:"numeric",
                month:"2-digit",
                day:"2-digit"
            }
        );


    slider.value = 0;

    updateSlider();

}


function getVoterId(){

    let id =
        localStorage.getItem(
            "sseulsaeop_voter_id"
        );


    if(!id){

        id =
            crypto.randomUUID();

        localStorage.setItem(
            "sseulsaeop_voter_id",
            id
        );

    }

    return id;

}


async function saveRating(){

    const fact =
        facts[current];

    const score =
        Number(
            Number(slider.value)
            .toFixed(2)
        );


    try{

        /*
         * 기존 테이블 구조에 voter_id가
         * 있는 경우 사용
         */
        const {error} =
            await db
            .from("ratings")
            .insert({

                fact_id:fact.id,

                voter_id:
                    getVoterId(),

                score:score

            });


        if(error){

            console.error(
                "RATING ERROR:",
                error
            );

        }

    }catch(error){

        console.error(error);

    }

}


async function nextFact(){

    await saveRating();


    if(current < facts.length - 1){

        current++;

    }else{

        /*
         * 마지막까지 본 뒤에는 처음으로
         */
        current=0;

    }


    showFact();

}


document
.getElementById("down")
.addEventListener(
    "click",
    nextFact
);


/* 마우스 / 터치 스와이프 */

factArea.addEventListener(
    "pointerdown",
    e=>{

        startY=e.clientY;
        dragging=true;

    }
);


factArea.addEventListener(
    "pointerup",
    e=>{

        if(!dragging) return;

        dragging=false;

        const diff =
            e.clientY - startY;


        if(Math.abs(diff) > 70){

            nextFact();

        }

    }
);


/* 모바일 위아래 스와이프 */
factArea.addEventListener(
    "touchstart",
    e=>{

        startY =
            e.changedTouches[0].clientY;

    },
    {passive:true}
);


factArea.addEventListener(
    "touchend",
    e=>{

        const endY =
            e.changedTouches[0].clientY;

        const diff =
            endY - startY;


        if(Math.abs(diff) > 70){

            nextFact();

        }

    },
    {passive:true}
);


/* PC Space / 아래 방향키 */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.code === "Space" ||
            e.key === "ArrowDown"
        ){

            e.preventDefault();

            nextFact();

        }

    }
);


loadFacts();

</script>

</body>
</html>
