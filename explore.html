<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>구경 — SseulSaEop</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root{
--bg:#d9c8ff;
--deep:#211334;
--purple:#6338a8;
--forest:#173d2c;
--olive:#68752d;
--gray:#77717e;
--line:#b7a6d3;
}

*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
}

body{
background:
radial-gradient(circle at 20% 10%,#fff,transparent 27%),
linear-gradient(135deg,#d9c8ff,#b99cff);
color:var(--deep);
font-family:"IBM Plex Sans KR",sans-serif;
word-break:keep-all;
}

a{
color:inherit;
text-decoration:none;
}

.header{
height:72px;
padding:0 5vw;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid #ffffff88;
}

.logo{
font:700 21px "Space Grotesk";
}

.nav{
display:flex;
gap:28px;
font:700 14px "Space Grotesk","IBM Plex Sans KR";
}

.explore{
height:calc(100vh - 72px);
}

.layout{
width:min(1050px,90%);
height:100%;
margin:auto;
display:grid;
grid-template-rows:42% 58%;
}

.score-panel{
position:relative;
display:flex;
align-items:center;
justify-content:center;
}

.score-line{
position:absolute;
width:75%;
height:3px;
background:linear-gradient(
to right,
var(--forest),
#77717e,
var(--olive)
);
}

.slider{
position:absolute;
width:75%;
height:35px;
opacity:0;
cursor:pointer;
z-index:5;
}

.knob{
position:absolute;
width:24px;
height:24px;
border-radius:50%;
border:5px solid var(--purple);
background:white;
transform:translate(-50%,-50%);
pointer-events:none;
z-index:4;
}

.value{
position:absolute;
top:calc(50% + 25px);
transform:translateX(-50%);
font:700 12px "Space Grotesk";
}

.label{
position:absolute;
top:calc(50% - 38px);
font:700 10px "Space Grotesk";
}

.useless{
left:12%;
color:var(--forest);
}

.useful{
right:12%;
color:var(--olive);
}

.fact-area{
display:flex;
justify-content:center;
align-items:flex-start;
padding-top:20px;
touch-action:pan-y;
}

.fact-card{
width:min(800px,90%);
padding:35px 45px;
background:#ffffffb8;
border:1px solid var(--line);
text-align:center;
}

.date{
margin-bottom:20px;
color:var(--gray);
font:500 10px "Space Grotesk";
}

.fact{
margin:0;
font:700 clamp(25px,4vw,45px)/1.4 "Space Grotesk","IBM Plex Sans KR";
letter-spacing:-1.5px;
}

.nickname{
margin-top:22px;
color:var(--gray);
font-size:11px;
}

.down{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:48px;
height:48px;
border:1px solid var(--forest);
background:var(--forest);
color:white;
font-size:20px;
cursor:pointer;
z-index:20;
}

.down:hover{
background:var(--olive);
}

.loading{
height:100%;
display:grid;
place-items:center;
font-size:13px;
}


/* MOBILE */

@media(max-width:800px){

.header{
height:64px;
padding:0 5%;
}

.nav{
gap:14px;
font-size:11px;
}

.explore{
height:calc(100dvh - 64px);
}

.layout{

width:100%;
height:100%;

display:grid;

grid-template-columns:
minmax(0,1fr) 82px;

grid-template-rows:1fr;

}

.fact-area{

width:100%;
height:100%;

padding:
15px
8px
15px
15px;

align-items:center;

overflow:hidden;

}

.fact-card{

width:100%;

height:
calc(100dvh - 115px);

padding:
50px 18px 35px;

display:flex;
flex-direction:column;
justify-content:center;
align-items:flex-start;

text-align:left;

overflow:hidden;

}

.date{
position:absolute;
top:18px;
left:18px;
}

.fact{

width:100%;

font-size:
clamp(22px,7vw,36px);

line-height:1.4;

}

.nickname{
margin-top:22px;
}

.score-panel{

width:82px;
height:100%;

overflow:visible;

}

.score-line{

left:50%;
top:50%;

width:3px;
height:72%;

transform:
translate(-50%,-50%);

background:linear-gradient(
to bottom,
var(--forest),
#77717e 50%,
var(--olive)
);

}

.slider{

left:50%;
top:50%;

width:72%;
height:100%;

transform:
translate(-50%,-50%)
rotate(-90deg);

}

.knob{

left:50%;
top:50%;

}

.value{

left:50%;

top:calc(50% + 28px);

transform:translateX(-50%);

}

.label{

left:50% !important;
right:auto !important;

transform:translateX(-50%);

width:70px;

text-align:center;

}

.useless{
top:10%;
}

.useful{
top:auto;
bottom:10%;
}

.down{

bottom:12px;

width:43px;
height:43px;

}

}
</style>
</head>


<body>


<header class="header">

<a href="./index.html" class="logo">
SseulSaEop
</a>

<nav class="nav">

<a href="./index.html">홈</a>

<a href="./share.html">공유</a>

<a href="./explore.html">구경</a>

</nav>

</header>


<main class="explore">


<div id="loading" class="loading">
불러오는 중...
</div>


<div
id="content"
class="layout"
style="display:none"
>


<section class="score-panel">

<div class="label useless">
−10 USELESS
</div>

<div class="label useful">
+10 USEFUL
</div>

<div class="score-line"></div>


<input
id="slider"
class="slider"
type="range"
min="-10"
max="10"
step="0.01"
value="0"
>


<div id="knob" class="knob"></div>

<div id="value" class="value">
0.00
</div>

</section>


<section id="factArea" class="fact-area">

<article class="fact-card">

<div id="date" class="date"></div>

<p id="fact" class="fact"></p>

<div id="nickname" class="nickname"></div>

</article>

</section>

</div>


<button
id="down"
class="down"
title="다음 사실"
>
↓
</button>


</main>


<script>

const db=supabase.createClient(
"https://awujryapgmbhjvagonea.supabase.co",
"sb_publishable_kTh-cDGS1NZxuTnBMe0qtQ_M6Wn65DE"
);


let facts=[];
let current=0;
let startY=0;


const slider=
document.getElementById("slider");

const knob=
document.getElementById("knob");

const value=
document.getElementById("value");


function updateSlider(){

const score=Number(slider.value);

value.textContent=
score>=0
? "+"+score.toFixed(2)
: score.toFixed(2);


const percent=(score+10)/20;


if(window.innerWidth<=800){

knob.style.top=
`${100-percent*100}%`;

knob.style.left="50%";

}else{

knob.style.left=
`${percent*100}%`;

knob.style.top="50%";

}

}


slider.addEventListener(
"input",
updateSlider
);


async function loadFacts(){

const {data,error}=await db
.from("facts")
.select("id,nickname,fact,created_at")
.order("created_at",{ascending:false});


if(error){

console.error(error);

document.getElementById("loading").textContent=
"사실을 불러오지 못했습니다.";

return;

}


facts=data||[];


if(facts.length===0){

document.getElementById("loading").innerHTML=`
<div style="text-align:center">
아직 등록된 사실이 없습니다.<br><br>
<a href="./share.html"
style="font-weight:700">
첫 번째 사실 남기기 →
</a>
</div>
`;

document.getElementById("down").style.display="none";

return;

}


document.getElementById("loading").style.display="none";

document.getElementById("content").style.display="grid";

showFact();

}


function showFact(){

const item=facts[current];


document.getElementById("fact").textContent=
item.fact;


document.getElementById("nickname").textContent=
"by "+(item.nickname||"익명");


const date=new Date(item.created_at);


document.getElementById("date").textContent=
date.toLocaleDateString(
"ko-KR",
{
year:"numeric",
month:"2-digit",
day:"2-digit"
}
);


slider.value=0;

updateSlider();

}


async function saveRating(){

const item=facts[current];

const score=
Number(Number(slider.value).toFixed(2));


const {error}=await db
.from("ratings")
.insert({

fact_id:item.id,

score:score

});


if(error){

console.error(
"평가 저장 오류:",
error
);

}

}


async function nextFact(){

await saveRating();


current++;

if(current>=facts.length){
current=0;
}

showFact();

}


/* ↓ 버튼 */

document
.getElementById("down")
.addEventListener(
"click",
nextFact
);


/* PC Space / 아래 화살표 */

document.addEventListener(
"keydown",
e=>{

if(
e.code==="Space" ||
e.key==="ArrowDown"
){

e.preventDefault();

nextFact();

}

}
);


/* 위아래 스와이프 */

const area=
document.getElementById("factArea");


area.addEventListener(
"touchstart",
e=>{

startY=
e.changedTouches[0].clientY;

},
{passive:true}
);


area.addEventListener(
"touchend",
e=>{

const endY=
e.changedTouches[0].clientY;

const diff=endY-startY;


if(Math.abs(diff)>60){

nextFact();

}

},
{passive:true}
);


/* 마우스 드래그 */

let mouseStart=0;

area.addEventListener(
"mousedown",
e=>{

mouseStart=e.clientY;

}
);


area.addEventListener(
"mouseup",
e=>{

const diff=e.clientY-mouseStart;

if(Math.abs(diff)>60){

nextFact();

}

}
);


loadFacts();

</script>

</body>
</html>
