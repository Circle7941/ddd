<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사실 공유 — SseulSaEop</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root{
    --purple:#eee5ff;
    --deep:#24143d;
    --violet:#6741b5;
    --forest:#173d2c;
    --muted:#756d7f;
    --line:#d9d0e7;
}

*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:var(--purple);
    color:var(--deep);
    font-family:"IBM Plex Sans KR",sans-serif;
}

.header{
    height:72px;
    padding:0 5vw;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ffffff99;
}

.logo{
    font:700 21px "Space Grotesk";
}

.nav{
    display:flex;
    gap:28px;
    font:700 13px "Space Grotesk","IBM Plex Sans KR";
}

a{
    color:inherit;
    text-decoration:none;
}

.container{
    width:min(720px,90%);
    margin:auto;
}

.page{
    min-height:calc(100vh - 72px);
    display:flex;
    align-items:center;
    padding:70px 0;
}

.back{
    display:inline-block;
    margin-bottom:30px;
    font:700 12px "Space Grotesk";
}

h1{
    margin:0;
    font:700 clamp(40px,7vw,70px)/1.05 "Space Grotesk","IBM Plex Sans KR";
    letter-spacing:-3px;
}

.sub{
    margin:20px 0 40px;
    color:var(--muted);
    font-size:13px;
    line-height:1.8;
}

label{
    display:block;
    margin:20px 0 8px;
    font-size:11px;
    font-weight:700;
}

input,
textarea{
    width:100%;
    border:1px solid #cfc5dc;
    border-radius:0;
    outline:none;
    padding:15px;
    background:#ffffffc9;
}

input{
    height:50px;
}

textarea{
    min-height:220px;
    resize:vertical;
}

input:focus,
textarea:focus{
    border-color:var(--violet);
    box-shadow:0 0 0 3px #6741b520;
}

.submit{
    width:100%;
    margin-top:18px;
    padding:17px;
    border:1px solid var(--forest);
    background:var(--forest);
    color:white;
    font:700 13px "Space Grotesk","IBM Plex Sans KR";
}

.submit:hover{
    background:#65702b;
}

.toast{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    padding:13px 18px;
    background:var(--deep);
    color:white;
    font-size:12px;
    opacity:0;
    transition:.2s;
}

.toast.show{
    opacity:1;
}

@media(max-width:600px){
    .header{height:64px}
    .nav{gap:13px;font-size:11px}
    .page{min-height:calc(100dvh - 64px)}
}
</style>
</head>

<body>

<header class="header">

<a class="logo" href="index.html">
    SseulSaEop
</a>

<nav class="nav">
    <a href="index.html">홈</a>
    <a href="share.html">공유</a>
    <a href="explore.html">구경</a>
</nav>

</header>


<main class="page">

<div class="container">

<a class="back" href="index.html">
    ← HOME
</a>

<h1>
    당신만의<br>
    쓸모없는 사실은?
</h1>

<p class="sub">
    아무에게도 필요하지 않을 것 같지만<br>
    이상하게 기억에 남는 사실을 남겨주세요.
</p>


<label>닉네임</label>

<input
    id="nickname"
    maxlength="30"
    placeholder="어떤 이름으로 남길까요?"
>


<label>쓸모없는 사실</label>

<textarea
    id="fact"
    maxlength="2000"
    placeholder="당신만 알고 있는 쓸모없는 사실을 적어주세요."
></textarea>


<button
    id="submit"
    class="submit"
>
    사실 남기기 →
</button>

</div>

</main>


<div id="toast" class="toast"></div>


<script>

const db =
supabase.createClient(
    "https://awujryapgmbhjvagonea.supabase.co",
    "sb_publishable_kTh-cDGS1NZxuTnBMe0qtQ_M6Wn65DE"
);


function toast(text){

    const el =
        document.getElementById("toast");

    el.textContent=text;
    el.classList.add("show");

    setTimeout(
        ()=>el.classList.remove("show"),
        2300
    );
}


document
.getElementById("submit")
.addEventListener(
    "click",
    async ()=>{

        const nickname =
            document
            .getElementById("nickname")
            .value.trim();

        const fact =
            document
            .getElementById("fact")
            .value.trim();


        if(!fact){

            toast(
                "사실을 하나 적어주세요."
            );

            return;
        }


        const button =
            document.getElementById("submit");

        button.disabled=true;
        button.textContent="저장 중...";


        const {error} =
            await db
            .from("facts")
            .insert({
                nickname:
                    nickname || "익명",
                fact
            });


        if(error){

            console.error(error);

            toast(
                "저장하지 못했습니다."
            );

        }else{

            document
            .getElementById("nickname")
            .value="";

            document
            .getElementById("fact")
            .value="";

            toast(
                "쓸모없는 사실이 등록되었습니다."
            );

        }


        button.disabled=false;
        button.textContent="사실 남기기 →";

    }
);

</script>

</body>
</html>
